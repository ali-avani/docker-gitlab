# Example gitlab-runner/config.toml, written by "bash ./install.sh --runner".
concurrent = 2
check_interval = 3
shutdown_timeout = 0

[session_server]
  session_timeout = 1800

[[runners]]
  name = "my-runner"
  url = "http://gitlab:80"
  token = "glrt-REPLACE-ME"
  executor = "docker"
  limit = 2
  request_concurrency = 2

  [runners.cache]
    MaxUploadedArchiveSize = 0

  [runners.docker]
    tls_verify = false
    image = "docker:latest"
    privileged = true
    pull_policy = "if-not-present"
    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false
    memory = "2g"
    memory_swap = "2g"
    memory_reservation = "1g"
    volumes = ["/cache"]
    shm_size = 0
    network_mtu = 0
